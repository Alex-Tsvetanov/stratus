# Build the C++ service and check that both Terraform modules format and
# validate. terraform apply is deliberately absent: there are no AWS credits,
# and Azure was already measured and destroyed. Do not add an apply step.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: cmake + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  terraform:
    name: terraform ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [aws, azure]
    defaults:
      run:
        working-directory: infra/modules/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Format
        run: terraform fmt -check -diff

      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
        # No plan. No apply. Validate only.
